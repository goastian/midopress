version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - misspell
    - unconvert
  exclusions:
    rules:
      # the test helper reads and closes the body before returning the response
      - path: _test\.go
        linters:
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/goastian/midopress

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --clean
      - name: Package
        run: |
          for d in dist/midopress_*/; do
            platform="$(basename "$d" | sed -E 's/^midopress_//; s/_v[0-9]+$//; s/_(sse2|v8\.0)$//')"
            name="midopress_${GITHUB_REF_NAME#v}_${platform}"
            mkdir "$name"
            cp "$d"midopress* "$name/"
            cp LICENSE NOTICE README.md "$name/"
            if [[ "$platform" == windows_* ]]; then zip -qr "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
          done
          ls
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            midopress_*.tar.gz
            midopress_*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum midopress_* > checksums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --generate-notes midopress_* checksums.txt

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-latest
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install libjpeg (linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev
      - name: Install libjpeg (macos)
        if: matrix.os == 'darwin'
        run: |
          brew install jpeg-turbo
          prefix="$(brew --prefix jpeg-turbo)"
          echo "CGO_CFLAGS=-I$prefix/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$prefix/lib" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --single-target --clean
      - name: Package
        run: |
          name="midopress_${GITHUB_REF_NAME#v}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir "$name"
          cp dist/midopress_*/midopress "$name/"
          cp LICENSE NOTICE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: midopress_${{ matrix.os }}_${{ matrix.arch }}
          path: midopress_*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum midopress_*.tar.gz > checksums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --generate-notes midopress_*.tar.gz checksums.txt

# MidoPress configuration, with every setting at its default value.
#
# Precedence, lowest to highest: these defaults, this file, MIDOPRESS_*
# environment variables, command line flags. The environment variable of a
# setting is its path in upper case: pipeline.text.brotli is
# MIDOPRESS_PIPELINE_TEXT_BROTLI. Lists are comma separated there.
#
# Check a file without starting the server:
#   midopress config check -config midopress.yaml

listen:
  addr: ":9999"
  # Speak TLS to the clients. Browsers then need a PAC file, see the README.
  # The certificate is re-read on SIGHUP and when the files change.
  tls:
    cert: ""
    key: ""

# HTTPS interception. Leave ca_cert empty to tunnel HTTPS untouched, which
# means nothing in it gets compressed. Create a CA with `midopress ca init`.
mitm:
  ca_cert: ""
  ca_key: ""
  # Lifetime of the certificates made for each site.
  leaf_ttl: 48h
  cache_size: 10000
  # When a client rejects our certificate (a pinned app, or a CA it does not
  # trust), that host is tunnelled untouched for this long.
  auto_passthrough_ttl: 6h
  # Hosts that are never intercepted. Three forms: an exact name, "*.example.com"
  # for every subdomain, and "~d <regex>" tested against the host name.
  passthrough: []
  # A built-in list of banks, government, health, password managers and
  # Mozilla services that are never intercepted.
  default_passthrough: true

auth:
  # none, basic (auth.user and auth.pass) or token (one token per device).
  mode: none
  user: ""
  pass: ""
  # JSON file managed with `midopress device add|list|revoke`.
  devices_file: ""
  # Only accept clients on private, loopback or link-local addresses. To serve
  # clients on the internet turn this off AND set auth.mode.
  block_global: true
  # Wrong credentials allowed per client address within failure_window before
  # that address is refused for the rest of the window.
  max_failures: 10
  failure_window: 1m

upstream:
  dial_timeout: 10s
  tls_handshake_timeout: 10s
  # How long an origin may take to start answering.
  response_header_timeout: 30s
  idle_conn_timeout: 1m30s
  max_idle_conns_per_host: 64
  dns_cache_ttl: 30s
  # Refuse to connect to loopback, private and link-local addresses. Turn this
  # on for a proxy that is open to the internet.
  deny_private: false

server:
  read_header_timeout: 10s
  idle_timeout: 2m
  tls_handshake_timeout: 10s
  # On shutdown, how long to wait for requests and tunnels before closing them.
  shutdown_grace: 30s

pipeline:
  # A recoded response must be at least this fraction smaller than the original,
  # otherwise the original is sent.
  min_gain: 0.02
  # Image recoding is CPU heavy. 0 means one job per CPU. When all slots stay busy
  # for transcode_wait, the response is passed through instead of queueing.
  max_concurrent_transcodes: 0
  transcode_wait: 250ms
  # Memory the pipeline may hold in buffers and pictures at once. A response that
  # does not find room within transcode_wait is passed through. Recoding a picture
  # takes 80 to 190 bytes per pixel (measured: 1.9 megapixels hold 140 to 320 MB
  # at their peak, 7.7 megapixels over a gigabyte), so this decides how many big
  # ones are recoded together. 0 takes a quarter of the memory of the machine or
  # container, at least 256MiB and at most 8GiB. A picture that needs more than the
  # whole budget is never recoded (256MiB: over about 1.3 megapixels with AVIF), and
  # one that finds no room now is recoded in the background for the next request.
  # Needs a restart to change.
  memory_budget: 0
  # How far images may be pushed. Every profile keeps an image looking the same
  # to a person; they differ in how strict the measured similarity is.
  #   lossless  only bit-exact work: metadata, PNG optimization, lossless recoding
  #   balanced  similarity 0.975, dimensions never change
  #   saver     similarity 0.95, big images shrink to the screen size when the
  #             client says it (Sec-CH-Viewport-Width, Sec-CH-DPR or the
  #             X-MidoPress-Viewport header, WIDTHxDPR); lossy animations
  #   extreme   similarity 0.90, PNG graphics reduced to 256 colours, animations
  #             become their first frame
  # A client can ask for another one with the X-MidoPress-Profile header, and
  # Save-Data: on raises balanced to saver.
  profile: balanced
  # What to do with a response that says Cache-Control: no-transform, which
  # RFC 9111 says a proxy must not change. It was made to stop operators from
  # damaging content on its way to a person; here the proxy is the one the person
  # chose, and an image is only replaced by a result that was measured.
  #   profile  what the profile says (default): lossless and balanced respect it,
  #            saver and extreme recode the images that carry it
  #   respect  always keep it
  #   images   recode images that carry it, in every profile
  #   all      recode text too, which can break files that are signed or hashed
  # A request that says it is always respected, and so are ranges. A rule can
  # change it for a site with `set: {no_transform: images}`.
  no_transform: profile
  text:
    # Compression levels. 0 uses the level of the profile, which also compresses
    # responses that look cacheable with a slower level, once, and keeps the result.
    brotli: 0
    gzip: 0
    zstd: 0
    # What to minify: off, safe or aggressive. Safe never changes how a page
    # looks or what a script does. Minified files break Subresource Integrity
    # (integrity="...") checks, which is why JavaScript is off by default. Files
    # that already look minified are skipped. A plain true or false sets them all.
    minify:
      html: safe
      css: safe
      js: "off"
      svg: safe
      json: safe
    # Turn gzip, deflate and zstd responses into brotli when the client accepts
    # it. Only done for bodies of known size up to buffer_max.
    recompress: true
    # Bodies up to this size are buffered, which allows checking that the result
    # is smaller. Larger ones, and bodies of unknown length, are streamed.
    buffer_max: 1MiB
    min_bytes: 256
    # Largest size a compressed body may expand to.
    max_decoded: 32MiB
  image:
    # Recode JPEG images.
    jpeg: true
    # 0 finds, for each image, the lowest quality that meets the profile. A
    # number from 1 to 100 fixes the quality instead. A client can ask for one
    # per request with the X-MidoPress-Quality header.
    jpeg_quality: 0
    png: true
    # GIF, animated ones become animated WebP for clients that accept it.
    gif: true
    # Recode the WebP and AVIF pictures that sites already send, measured against
    # what the site sent. Animated ones, and the ones that carry a colour profile
    # other than sRGB, an orientation or a crop, are left alone.
    modern: true
    # Read the HTML that goes by to learn how wide each image is shown, so that the
    # profiles that resize (saver, extreme) can do it when the client does not say
    # the size of its screen, and which scripts and style sheets the page loads
    # with an integrity hash, which are never minified.
    page_hints: true
    # Pixel density assumed for those widths: the page says how wide, not how
    # dense the screen is. 2 keeps the detail of a phone or a hi-dpi laptop.
    hint_dpr: 2
    min_bytes: 1KiB
    max_bytes: 8MiB
    max_pixels: 16000000
    # Longest a request waits for an image to be recoded.
    timeout: 3s
    # What decides that a recoded image is close enough to the original:
    # dssim (default), ssim, or ssimulacra2. Every profile has a target for each.
    metric: dssim
    # wasm needs nothing installed. vips needs a binary built with -tags vips and
    # libvips on the machine, and is faster.
    backend: wasm
    # AVIF and JPEG XL take seconds in WebAssembly. With this on, an image that
    # does not fit in timeout is sent as it is and recoded in the background,
    # and the next request finds the best result in the cache.
    background: true
    background_timeout: 2m
    # Compile the image codecs when the proxy starts instead of on the first image.
    warmup: true

# Where results are kept so that a popular image or font is only recoded once.
# They are addressed by the content of the original, so they never go stale; the
# TTLs only stop what the origin marks as short lived from taking space. The
# origin's Cache-Control (s-maxage, max-age, immutable, no-store, ...) and Expires
# choose a TTL between min_ttl and max_ttl.
cache:
  memory: 256MiB
  # A disk tier survives restarts. Empty dir means no disk tier.
  dir: ""
  max_size: 5GiB
  min_ttl: 1m
  max_ttl: 168h
  default_ttl: 1h

# Change a built-in profile or define a new one. Every field is optional and
# starts from the base profile. For example:
#
# profiles:
#   balanced:
#     target_dssim: 0.0015
#     formats: [jxl, webp]
#   mobile:
#     base: saver
#     resize_to_viewport: true
#     animated_to_still: true
#     text: {brotli: 7}
#
# The fields are target_dssim, target_ssim, target_ssimulacra2, attempts,
# formats, resize_to_viewport, photo_colors, quantize_png, animated_to_still,
# animated_quality, avif_effort (1 to 10, how hard AVIF is tried: 4 in balanced and
# 5 in saver and extreme, never above 2 with WebAssembly), no_transform (respect,
# images or all, see pipeline.no_transform), minify_js and text {brotli, gzip,
# zstd, brotli_static, static_wait_ms (the most a request waits for the slow
# brotli level, in milliseconds)}. A device can be given a profile with
# `midopress device add -profile NAME`.
profiles: {}

# Rules decide what happens to each request or response, in order. `action` is
# passthrough (leave the response alone) or passthrough_tls (do not intercept
# the HTTPS connection, only with conditions on the host); `profile` picks a
# profile; `set` changes minify_html, minify_css, minify_js, minify_svg,
# minify_json (off, safe, aggressive, true, false), images (bool), text (bool),
# quality (1 to 100) and no_transform (respect, images, all). Profile and set accumulate, the first action stops the
# evaluation. The conditions use the mitmproxy filter language: ~d domain, ~u
# URL, ~t content type, ~c status, ~m method, ~h/~hq/~hs headers, ~b body, ~q
# request, ~s response, ~src/~dst address, with & | ! and parentheses. For
# example:
#
# rules:
#   - match: '~d (bank|banco|paypal|health)\.'
#     action: passthrough_tls
#   - match: '~u \.(mp4|webm|m3u8|ts)$ | ~t video/'
#     action: passthrough
#   - match: '~d cdn\.example\.com & ~t image/'
#     profile: extreme
#   - match: '~u /app\.js$'
#     set: {minify_js: true}
#
# Rules, profiles, mitm.passthrough, the default profile, minification and
# log.level are applied when the file changes or on SIGHUP, without a restart.
rules: []

metrics:
  # Prometheus text format at /metrics.
  prometheus: true
  # Serve it on a listener of its own, for example 127.0.0.1:9100. Empty serves it
  # on the proxy port, to the clients the proxy accepts.
  addr: ""

# The administration interface: dashboard, devices, live flows, rules and
# profiles editor, certificate, logs. Open http://127.0.0.1:9998/ and sign in
# with the token that `midopress admin token` shows.
web:
  enabled: true
  # The loopback by default; anything else is protected by the token alone.
  addr: 127.0.0.1:9998
  # Where the token (admin.token) and what the interface saves (ui.yaml) live.
  # Empty means ~/.midopress. What ui.yaml holds wins over this file.
  state_dir: ""
  admin_token_file: ""
  # Start with the live list of flows (shows URLs, kept in memory only) and the
  # aggregation by domain on. Both can be switched from the interface.
  flows: false
  domains: false
  flow_buffer: 500
  # Memory for the bodies of images, so original and result can be compared.
  capture_bytes: 64MiB
  # The name the proxy answers by itself with the page that explains how to
  # install the certificate. Empty turns it off.
  magic_host: midopress.it
  # Serve the Go profiler under /debug/pprof on the administration server.
  pprof: false

log:
  level: info
  # text or json
  format: text
  # Log request URLs and host names. Off by default: the proxy sees everything
  # its users browse.
  urls: false

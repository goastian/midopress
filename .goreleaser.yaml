version: 2

project_name: midopress

# No cgo: the image codecs run as WebAssembly inside the binary, so every
# target is cross compiled from one runner.
builds:
  - id: midopress
    main: ./cmd/midopress
    binary: midopress
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

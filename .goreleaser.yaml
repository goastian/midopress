version: 2

project_name: midopress

# The codecs still use cgo (libjpeg, libwebp), so every target is built on a
# runner of its own platform with `goreleaser build --single-target`.
builds:
  - id: midopress
    main: ./cmd/midopress
    binary: midopress
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
